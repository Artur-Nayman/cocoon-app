name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * *' # nightly: catches yt-dlp / YouTube breakage

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Multiple audio layers play simultaneously
        run: npm run test:audio

      - name: yt-dlp binary runs
        run: npm run test:ytdlp -- -t "binary runs"
      # ponytail: YouTube often blocks CI IPs, so this one warns instead of failing
      - name: yt-dlp can extract audio from YouTube
        continue-on-error: true
        run: npm run test:ytdlp -- -t "extracts"

  build-electron:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux
      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: electron-app-${{ matrix.os }}
          path: release/
